# Minimal workload used only to prove that the local k3d/k3s cluster can
# schedule a pod and serve HTTP traffic. This is NOT the CASCADE application
# (that is implemented in Phase 2) and carries no business logic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
  namespace: cascade-test
  labels:
    app: smoke-test
    app.kubernetes.io/part-of: cascade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
