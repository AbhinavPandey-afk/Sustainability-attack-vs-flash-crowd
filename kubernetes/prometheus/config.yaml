# Minimal scrape config: discovers pods in the 'cascade' namespace and
# scrapes only those annotated prometheus.io/scrape: "true" (set on the
# cascade-app Deployment's pod template — kubernetes/app-deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cascade
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: cascade-app
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["cascade"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
