# Scoped to the 'cascade' namespace only (not a ClusterRole) — Prometheus
# only needs to discover pods/services/endpoints inside this project's own
# namespace, nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cascade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: cascade
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: cascade
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cascade
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
