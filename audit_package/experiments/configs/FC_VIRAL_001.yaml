# NOTE ON SCALE: proof-of-concept / CI-friendly, like the other configs
# in this directory — see docs/experiment_protocol.md.
#
# Reproduces a viral-event arrival curve (trickle -> S-curve ramp -> peak
# -> decay, traffic/generators/viral_shape.py) instead of the flat linear
# ramp used by FC_001-003, addressing the requirement that flash-crowd
# traffic reproduce the arrival pattern of a genuine viral event.
experiment:
  name: FC_VIRAL_001
  label: 0
  scenario_type: flash_crowd
  scenario_file: traffic/scenarios/flash_crowd_viral.yaml
  duration_seconds: 90
  seed: 42

detector:
  window_seconds: [20]
  step_seconds: 20

cost_model:
  replica_cost_per_minute: 1.0
  cpu_cost_weight: 0.0
  memory_cost_weight: 0.0

replica_sampler:
  interval_seconds: 5
  namespace: cascade
  deployment: cascade-app
  hpa: cascade-app

prometheus:
  base_url: http://localhost:9090
