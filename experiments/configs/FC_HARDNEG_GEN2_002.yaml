# Gen2 hard-negative flash crowd — repeatability repetition 2 of the
# approved design (identical scenario/config to
# FC_HARDNEG_GEN2_001.yaml, distinct seed only). See that file and
# traffic/scenarios/flash_crowd_hard_negative_gen2.yaml for full
# rationale. Does NOT modify FC_HARDNEG_GEN2_001 or any other existing
# config — additive, uniquely-identified repetition.
experiment:
  name: FC_HARDNEG_GEN2_002
  label: 0
  scenario_type: flash_crowd_cohort_mixed
  scenario_file: traffic/scenarios/flash_crowd_hard_negative_gen2.yaml
  duration_seconds: 75
  seed: 62

detector:
  window_seconds: [20]
  step_seconds: 20

cost_model:
  replica_cost_per_minute: 1.0
  cpu_cost_weight: 0.0
  memory_cost_weight: 0.0

replica_sampler:
  interval_seconds: 5
  namespace: cascade
  deployment: cascade-app
  hpa: cascade-app

prometheus:
  base_url: http://localhost:9090
