# Class 1 — EDoS (CLAUDE.md section 11).
# Few simulated clients, concentrated on the expensive endpoint, minimal
# think-time, no conversion. Deliberately kept at a request volume/rate
# comparable to (not obviously larger than) flash_crowd.yaml — see
# CLAUDE.md section 12 (Traffic Comparability Requirement); exact
# volume-matching is tuned per-experiment in later phases (E5/E6/E7).
scenario:
  name: edos
  type: edos
  description: "Synthetic EDoS: concentrated load on the expensive endpoint"

locust:
  users: 8
  spawn_rate: 8
  run_time_seconds: 60
  host: "http://localhost:8000"

behavior:
  think_time_min: 0.05
  think_time_max: 0.2
  report_complexity: 60
  weights:
    generate_report: 10
    checkout: 0
