# E3 — Flash Crowd + EDoS simultaneously (CLAUDE.md section 13).
# Both traffic classes run concurrently against the same app instance for
# the whole window. Ground truth for the resulting experiment is
# documented in docs/experiment_protocol.md: label=1 (attack present)
# throughout, since EDoS traffic is present for the entire run — the
# detector's job here is recognizing attack presence amid simultaneous
# legitimate load, not which traffic type is larger.
#
# STALE-CONFIG FIX (final-matrix design session): the `edos:` block below
# previously used `weights: {generate_report: 10, checkout: 0}` — no
# `home`/`search` key at all — which is the SAME deterministic
# endpoint-availability shortcut already found and fixed in
# traffic/scenarios/edos.yaml (docs/research_gap_audit.md Part 4: an
# EDoS class with zero probability of a home/search/converting request
# makes search_ratio/cheap_endpoint_ratio/conversion_rate a guaranteed
# 0 for EDoS windows, not a measured behavioural difference). This file's
# `edos:` block was not updated when edos.yaml was fixed, so MIX_001's
# embedded EDoS traffic silently kept using the old, structurally-biased
# weights. Fixed here to match edos.yaml's current weights exactly
# (generate_report:18, home:1, search:1, checkout:1) so MIX_001 is
# internally consistent with the rest of the project's EDoS traffic
# design. NOTE: any previously-collected MIX_001 data
# (data/experiments/MIX_001, data/features/held_out/MIX_001.csv) was
# generated under the OLD weights and is NOT regenerated by this change —
# per docs/experiment_protocol.md, that data remains provisional and a
# clean re-run is required before it is cited as evidence.
scenario:
  name: mixed
  type: mixed
  description: "E3: legitimate flash-crowd and EDoS traffic simultaneously"

locust:
  # Sum of flash_crowd.users + edos.users below, so a single Locust run
  # distributes exactly this many users across both User classes,
  # proportional to each class's `weight` (set in generators/mixed.py from
  # the per-class `users` values below).
  users: 58
  spawn_rate: 18
  run_time_seconds: 75
  host: "http://localhost:8000"

flash_crowd:
  users: 50
  behavior:
    think_time_min: 0.3
    think_time_max: 1.5
    search_terms: ["laptop", "phone", "shoes", "book", "camera", "headphones", "monitor"]
    weights:
      home: 3
      search: 5
      checkout: 1

edos:
  users: 8
  behavior:
    think_time_min: 0.05
    think_time_max: 0.2
    report_complexity: 60
    weights:
      generate_report: 18
      home: 1
      search: 1
      checkout: 1
